<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Bambino</title>
  <meta name="description" content="Bambino: baby growth, feeding, sleep and milestone tracker. Download for iPhone or Android." />
  <meta property="og:title" content="Download Bambino" />
  <meta property="og:description" content="Every feed, nap and milestone in one calm place." />
  <script>
    // Smart store redirect: one QR / link for both platforms.
    (function () {
      var IOS = 'https://apps.apple.com/us/app/bambino-growth-tracker/id6818366470';
      var src = new URLSearchParams(location.search).get('src') || 'qr';
      var ANDROID = 'https://play.google.com/store/apps/details?id=com.bambino.bambino' +
        '&referrer=' + encodeURIComponent('utm_source=' + src + '&utm_medium=social');
      var ua = navigator.userAgent || '';
      // iPadOS 13+ reports itself as a Mac; touch support tells them apart.
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      if (isIOS) location.replace(IOS);
      else if (isAndroid) location.replace(ANDROID);
      window.BAMBINO_STORES = { ios: IOS, android: ANDROID };
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    main.download {
      flex: 1; width: 100%; max-width: 520px; margin: 0 auto; padding: 48px 24px;
      text-align: center;
    }
    .download h1 { font-size: 30px; font-weight: 800; line-height: 1.25; margin-bottom: 12px; }
    .download p { color: var(--text-secondary); margin-bottom: 32px; }
    .stores { display: grid; gap: 14px; }
    .store-btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      min-height: 60px; border-radius: 16px; padding: 12px 20px;
      background: var(--text-primary); color: #fff; text-decoration: none;
      font-weight: 700; font-size: 17px;
    }
    .store-btn:hover { background: var(--primary-dark); text-decoration: none; }
    .store-btn svg { width: 24px; height: 24px; fill: currentColor; flex: none; }
    html[dir="rtl"] .download { font-family: 'Nunito', 'Tahoma', sans-serif; }
  </style>
</head>
<body>
  <header>
    <div class="logo">bambino</div>
  </header>
  <main class="download">
    <h1 data-en="Every feed, nap and milestone in one calm place"
        data-ar="كل رضعة ونومة وإنجاز في مكان واحد هادئ">Every feed, nap and milestone in one calm place</h1>
    <p data-en="Get Bambino free on your phone."
       data-ar="حمّلي تطبيق بامبينو مجانًا على هاتفك.">Get Bambino free on your phone.</p>
    <div class="stores">
      <a class="store-btn" id="ios-link" href="https://apps.apple.com/us/app/bambino-growth-tracker/id6818366470">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 12.6c-.03-2.6 2.12-3.85 2.22-3.91-1.21-1.77-3.09-2.01-3.76-2.04-1.6-.16-3.12.94-3.93.94-.81 0-2.06-.92-3.39-.89-1.74.03-3.35 1.01-4.25 2.57-1.81 3.14-.46 7.8 1.3 10.35.86 1.25 1.89 2.65 3.24 2.6 1.3-.05 1.79-.84 3.36-.84 1.57 0 2.01.84 3.38.81 1.4-.03 2.29-1.27 3.14-2.53.99-1.45 1.4-2.86 1.42-2.93-.03-.01-2.72-1.04-2.75-4.13zM13.79 4.97c.72-.87 1.2-2.07 1.07-3.27-1.03.04-2.28.69-3.02 1.55-.66.77-1.24 1.99-1.09 3.17 1.15.09 2.32-.58 3.04-1.45z"/></svg>
        <span data-en="Download on the App Store" data-ar="حمّليه من App Store">Download on the App Store</span>
      </a>
      <a class="store-btn" id="android-link" href="https://play.google.com/store/apps/details?id=com.bambino.bambino">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 1.8c-.3.3-.4.7-.4 1.2v18c0 .5.1.9.4 1.2l10-10.2L3.6 1.8zm11.1 11.3 2.8 2.8-11.6 6.6 8.8-9.4zm0-2.2L5.9 1.5l11.6 6.6-2.8 2.8zm3.9-2.2 3 1.7c.9.5.9 1.3 0 1.8l-3.1 1.8-3-3 3.1-2.3z"/></svg>
        <span data-en="Get it on Google Play" data-ar="احصلي عليه من Google Play">Get it on Google Play</span>
      </a>
    </div>
  </main>
  <script>
    var s = window.BAMBINO_STORES;
    if (s) document.getElementById('android-link').href = s.android;
    if (/^ar\b/i.test(navigator.language || '')) {
      document.documentElement.lang = 'ar';
      document.documentElement.dir = 'rtl';
      document.title = 'حمّلي بامبينو';
      document.querySelectorAll('[data-ar]').forEach(function (el) { el.textContent = el.dataset.ar; });
    }
  </script>
</body>
</html>
